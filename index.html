<!DOCTYPE html>
<html lang="en">
<head>

    <title>Где сейчас пара</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <h1>Где сейчас пара?</h1>

            <button>1 этаж</button>
            <button>2 этаж</button>

    <main>

        <section class="map-wrapper">

    <circle cx="85" cy="85" r="8" fill="#22c55e"/>
    <circle cx="185" cy="85" r="8" fill="#22c55e"/>
    <circle cx="285" cy="85" r="8" fill="#ef4444"/>
    <circle cx="385" cy="85" r="8" fill="#22c55e"/>
  </svg>
</section>
    </main>


    <footer>
        <p>Проект студента...</p>
    </footer>

    
</body>
</html>
